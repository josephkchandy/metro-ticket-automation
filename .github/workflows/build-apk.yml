name: Build APK

on:
  push:
    branches:
      - fix/upi-browser-handoff
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Metro-to-SN-0.5-reliability-fix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metro-to-SN-0.5-reliability-fix
          path: Metro-to-SN-0.5-reliability-fix.apk
          if-no-files-found: error
